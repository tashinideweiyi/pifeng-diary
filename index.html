<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7ead8" id="themeColorMeta" />
    <meta name="description" content="PiFeng日记，一个轻可爱、只保存在本地的私人流水账日记工具。" />
    <title>PiFeng日记</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="journal-card" aria-label="PiFeng日记">
        <header class="page-header">
          <div class="mini-decor" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <p class="brand">PiFeng日记</p>

          <button class="date-card" id="datePickerButton" type="button" aria-label="选择日期">
            <span id="currentDate">0000.00.00</span>
            <span id="dailyEmoji" aria-hidden="true">☁️</span>
          </button>
          <input class="hidden-date" id="datePicker" type="date" />

          <p class="theme-chip" id="themeChip">今日主题：薄荷云朵 ☁️</p>
          <p class="daily-note" id="dailyNote">今天也记一点点</p>
        </header>

        <div class="theme-divider" id="themeDivider" aria-hidden="true">· · ·</div>

        <form class="entry-form" id="entryForm" autocomplete="off">
          <div class="field">
            <label for="wakeTime">起床时间</label>
            <textarea id="wakeTime" name="wakeTime" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="sleep">睡眠情况</label>
            <textarea id="sleep" name="sleep" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="food">吃了什么</label>
            <textarea id="food" name="food" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="did">做了什么</label>
            <textarea id="did" name="did" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="people">见了谁 / 聊了什么</label>
            <textarea id="people" name="people" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="body">身体状态</label>
            <textarea id="body" name="body" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="learned">今天知道 / 学到的一件事</label>
            <textarea id="learned" name="learned" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="fact">今天一个小事实</label>
            <textarea id="fact" name="fact" rows="2"></textarea>
          </div>
        </form>

        <section class="history-panel" id="historyPanel" aria-label="历史日记" hidden>
          <div class="history-head">
            <h2>过去日记</h2>
            <button class="quiet-button" id="backTodayButton" type="button">回到今日</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>

        <footer class="action-bar">
          <button class="primary-action" id="copyButton" type="button">复制今日</button>
          <button id="historyButton" type="button">看过去</button>
          <div class="more-actions">
            <button class="more-toggle" id="moreButton" type="button" aria-expanded="false" aria-controls="moreMenu">
              更多
            </button>
            <div class="more-menu" id="moreMenu" hidden>
              <button id="exportButton" type="button">导出 Markdown</button>
              <button id="backupButton" type="button">备份数据</button>
              <button id="importButton" type="button">恢复数据</button>
              <button class="danger-action" id="clearButton" type="button">清空今日</button>
            </div>
          </div>
        </footer>
        <input class="backup-file" id="backupFile" type="file" accept="application/json,.json" />

        <p class="save-status" id="saveStatus" role="status" aria-live="polite">已自动保存</p>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
